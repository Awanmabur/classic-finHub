# Temporary dependency-repair workflow; executes only when this file is first added
# to the dedicated repair branch. It cannot push to master.
name: Regenerate safe Mongoose 8 lockfile
on:
  push:
    branches:
      - fix/mongoose-8-24-8-audit-20261112
    paths:
      - .github/workflows/mongoose-lockfile-remediation.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mongoose-8-24-8-audit-20261112
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve patched Mongoose within existing major version
        run: npm install mongoose@8.24.8 --save-exact --package-lock-only --ignore-scripts
      - name: Verify reproducible install
        run: npm ci --ignore-scripts
      - name: Enforce audit gate (no waiver)
        run: npm audit --audit-level=moderate
      - name: Verify project syntax and configuration
        run: npm run check
      - name: Commit only dependency manifest and lockfile to repair branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && { echo 'Nothing changed'; exit 1; }
          git diff --cached --name-only | grep -vEx '(package\.json|package-lock\.json)' && exit 1 || true
          git commit -m "fix(deps): patch Mongoose 8 to 8.24.8 with registry lockfile"
          git push origin HEAD:refs/heads/fix/mongoose-8-24-8-audit-20261112
