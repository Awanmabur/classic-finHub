name: Publish ClassicFin Hub production image

on:
  workflow_run:
    workflows: ["ClassicFin Hub security and integration"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Never publish from a pull request or another repository's workflow.
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exactly the verified commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Derive registry name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/classicfin" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish from the verified commit
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish immutable production image reference
        shell: bash
        run: |
          {
            echo "### ClassicFin Hub verified release artifact"
            echo ""
            echo "- Source commit: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- Immutable image: \`${{ env.IMAGE }}@${{ steps.build.outputs.digest }}\`"
            echo "- Deployment: operator-controlled; see docs/LAUNCH_RUNBOOK.md"
            echo "- No server deployment, database migration, or live certification is performed by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
