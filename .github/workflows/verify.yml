name: ClassicFin Hub security and integration
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      MONGO_PLATFORM_URI: mongodb://127.0.0.1:27018/classicfin_platform_db?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run secrets:check
      # Must pass: dependency advisories are not waived for a release.
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - name: Verify locked-down release checkout is readable by non-root migration runner
        run: |
          bash -n deploy/business-site-standalone-release.sh
          umask 077
          STAGE="$(mktemp -d /tmp/classicfin-index-ci.XXXXXXXX)"
          trap 'rm -rf "$STAGE"' EXIT
          git archive HEAD | tar -xf - -C "$STAGE"
          test -s "$STAGE/scripts/business-reviews-indexes.js"
          chmod -R a+rX "$STAGE"
          docker run --rm --user 1000:1000 --read-only \
            --mount "type=bind,src=$STAGE,dst=/workspace,readonly" \
            --workdir /workspace --entrypoint /bin/sh node:22-bookworm-slim \
            -ec 'test -r scripts/business-reviews-indexes.js && test -r src/config/mongo.js'
      - run: npm test
      - run: npm run perf:assets
      - name: Start isolated MongoDB replica-set container
        run: |
          docker run --detach --name cfh-ci-mongo --publish 127.0.0.1:27018:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 35); do
            if docker exec cfh-ci-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' 2>/dev/null | grep -qx 1; then break; fi
            sleep 2
          done
          docker exec cfh-ci-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 35); do
            if docker exec cfh-ci-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -qx true; then break; fi
            sleep 2
          done
          docker exec cfh-ci-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'
      - run: npm run indexes
      - name: Verify additive public-review indexes
        run: node scripts/business-reviews-indexes.js
      - name: Verify moderated business reviews on isolated MongoDB
        run: node scripts/business-reviews-integration.js
      - name: Verify atomic approved tariff schedule supersession
        run: node scripts/tariff-supersede-integration.js
      - run: npm run catalog:publish -- --apply
      - name: Verify guarded two-currency financial posting in isolated MongoDB
        run: node scripts/momo-fx-settlement-integration.js
      - name: Run scratch-only production-gate integration tests
        run: npm run release:gate
